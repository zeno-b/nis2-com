id: nis2-web-hygiene

# ─────────────────────────────────────────────────────────────────────────────
# NIS2 web-security hygiene — DETECTION ONLY, max 5 requests per host.
#
# Observes only: response headers, cookie flags, CORS behaviour, information
# disclosure, technology fingerprints, exposed well-known files, and the TLS
# certificate. Sends NO exploit input — no injection, no path traversal to read
# files, no auth bypass, no fuzzing. It confirms a misconfiguration EXISTS and
# goes no further (a CVDP safe-harbour condition).
#
# Requires nuclei v3+ (uses a multi-protocol http + ssl template). If your
# nuclei predates v3, delete the trailing `ssl:` block and the 5th request.
#
# Absence checks use `negative: true` word matchers on `part: header`, the
# documented pattern that reliably fires when a header is missing. (An earlier
# revision used DSL `!contains(...)`, which is why nothing matched.)
#
# Request budget (5):
#   1. GET /                         — headers, cookies, CORS, disclosure, tech, body
#   2. GET /.well-known/security.txt — RFC 9116 presence / absence
#   3. GET /robots.txt               — sensitive paths disclosed
#   4. GET /.git/config              — exposed version-control metadata
#   5. TLS handshake ({{Host}}:443)  — certificate & protocol hygiene
# ─────────────────────────────────────────────────────────────────────────────

info:
  name: NIS2 Web Security Hygiene (detection-only)
  author: nis2-scanner
  severity: info
  description: >
    Non-intrusive detection of common web-security misconfigurations relevant to
    NIS2 posture. Observation only; no exploitation.
  tags: nis2,misconfig,headers,tls,exposure,detection
  classification:
    cwe-id:
      - CWE-16
      - CWE-693
      - CWE-200

http:
  # ── Request 1: root document ───────────────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Origin: "https://nis2-cors-probe.invalid"
    host-redirects: true
    max-redirects: 2
    matchers-condition: or
    matchers:
      # — Missing security headers (negative word matchers) —
      - type: word
        name: missing-hsts
        part: header
        case-insensitive: true
        negative: true
        words: ["strict-transport-security"]
      - type: word
        name: missing-csp
        part: header
        case-insensitive: true
        negative: true
        words: ["content-security-policy"]
      - type: word
        name: missing-x-frame-options
        part: header
        case-insensitive: true
        negative: true
        words: ["x-frame-options", "frame-ancestors"]
        condition: and
      - type: word
        name: missing-x-content-type-options
        part: header
        case-insensitive: true
        negative: true
        words: ["x-content-type-options"]
      - type: word
        name: missing-referrer-policy
        part: header
        case-insensitive: true
        negative: true
        words: ["referrer-policy"]
      - type: word
        name: missing-permissions-policy
        part: header
        case-insensitive: true
        negative: true
        words: ["permissions-policy"]
      - type: word
        name: missing-coop
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-opener-policy"]
      - type: word
        name: missing-corp
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-resource-policy"]
      - type: word
        name: missing-coep
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-embedder-policy"]

      # — Weak header values (present, positive) —
      - type: word
        name: weak-csp-unsafe-inline
        part: header
        words: ["unsafe-inline"]
      - type: word
        name: weak-csp-unsafe-eval
        part: header
        words: ["unsafe-eval"]
      - type: regex
        name: weak-hsts-max-age
        part: header
        regex:
          - "(?i)strict-transport-security:[^\\r\\n]*max-age=[0-9]{1,7}([^0-9]|$)"
      - type: dsl
        name: hsts-missing-includesubdomains
        dsl:
          - "contains(tolower(all_headers), 'strict-transport-security') && !contains(tolower(all_headers), 'includesubdomains')"

      # — Insecure cookies (compound: needs DSL) —
      - type: dsl
        name: cookie-missing-secure
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'secure')"
      - type: dsl
        name: cookie-missing-httponly
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'httponly')"
      - type: dsl
        name: cookie-missing-samesite
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'samesite')"

      # — CORS —
      - type: word
        name: cors-wildcard-origin
        part: header
        case-insensitive: true
        words: ["access-control-allow-origin: *"]
      - type: word
        name: cors-reflects-origin
        part: header
        case-insensitive: true
        words: ["access-control-allow-origin: https://nis2-cors-probe.invalid"]
      - type: dsl
        name: cors-allow-credentials-with-wildcard
        dsl:
          - "contains(tolower(all_headers), 'access-control-allow-credentials: true') && contains(tolower(all_headers), 'access-control-allow-origin: *')"

      # — Information / version disclosure —
      - type: regex
        name: server-version-disclosure
        part: header
        regex:
          - "(?i)server:\\s*\\S+/[0-9]+\\.[0-9]"
      - type: word
        name: x-powered-by-disclosure
        part: header
        case-insensitive: true
        words: ["x-powered-by"]
      - type: word
        name: aspnet-version-disclosure
        part: header
        case-insensitive: true
        words: ["x-aspnet-version", "x-aspnetmvc-version"]
        condition: or
      - type: word
        name: basic-auth-over-cleartext
        part: header
        case-insensitive: true
        words: ["www-authenticate: basic"]
      - type: regex
        name: internal-ip-in-headers
        part: header
        regex:
          - "(?i)(10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})"

      # — Technology fingerprint (body / headers) —
      - type: regex
        name: generator-meta-disclosure
        part: body
        regex:
          - "(?i)<meta[^>]+name=[\"']generator[\"'][^>]+content="
      - type: word
        name: tech-wordpress
        part: body
        words: ["/wp-content/", "/wp-includes/"]
        condition: or
      - type: word
        name: tech-drupal
        part: body
        words: ["Drupal.settings", "/sites/default/files"]
        condition: or
      - type: word
        name: tech-joomla
        part: body
        words: ["/media/jui/", "com_content", "Joomla!"]
        condition: or
      - type: word
        name: tech-magento
        part: body
        words: ["Mage.Cookies", "/static/version", "mage/cookies"]
        condition: or
      - type: word
        name: tech-typo3
        part: body
        words: ["typo3temp", "typo3conf"]
        condition: or
      - type: word
        name: tech-laravel
        part: header
        case-insensitive: true
        words: ["laravel_session", "x-laravel"]
        condition: or
      - type: word
        name: tech-django
        part: header
        case-insensitive: true
        words: ["csrftoken", "sessionid=", "django"]
        condition: or
      - type: word
        name: tech-express
        part: header
        case-insensitive: true
        words: ["x-powered-by: express"]

      # — Content integrity / disclosure (body) —
      - type: regex
        name: mixed-content-http-resource
        part: body
        regex:
          - "(?i)(src|href)=[\"']http://"
      - type: regex
        name: stack-trace-disclosure
        part: body
        regex:
          - "(?i)(stack trace:|traceback \\(most recent call last\\)|at [a-z0-9_.]+\\([A-Za-z0-9_]+\\.(java|cs|php|py):[0-9]+\\))"
      - type: word
        name: debug-mode-indicators
        part: body
        words:
          - "Whoops, looks like something went wrong"
          - "Werkzeug Debugger"
          - "DEBUG = True"
          - "Symfony\\Component\\Debug"
        condition: or
      - type: word
        name: directory-listing
        part: body
        words: ["Index of /", "Parent Directory"]
        condition: and
      - type: word
        name: default-webserver-page
        part: body
        words:
          - "Welcome to nginx!"
          - "Apache2 Ubuntu Default Page"
          - "IIS Windows Server"
          - "It works!"
        condition: or
      - type: word
        name: phpinfo-disclosure
        part: body
        words: ["phpinfo()", "PHP Version", "php_uname"]
        condition: and
      - type: regex
        name: private-key-disclosure
        part: body
        regex:
          - "-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----"
      - type: regex
        name: aws-access-key-disclosure
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"
      - type: regex
        name: html-comment-secret-hint
        part: body
        regex:
          - "(?i)<!--[^>]*(password|passwd|api[_-]?key|secret|todo|fixme|hardcoded)"

  # ── Request 2: RFC 9116 security.txt ───────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/security.txt"
    matchers-condition: or
    matchers:
      - type: dsl
        name: security-txt-present
        dsl:
          - "status_code == 200 && contains(tolower(body), 'contact:')"
      - type: dsl
        name: missing-security-txt
        dsl:
          - "status_code != 200"

  # ── Request 3: robots.txt ──────────────────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words: ["text/plain"]
      - type: regex
        name: sensitive-paths-disclosed
        part: body
        regex:
          - "(?i)disallow:\\s*/(admin|backup|backups|config|api|private|internal|\\.git|db|sql|old|tmp|test|staging|wp-admin|phpmyadmin)"

  # ── Request 4: exposed version-control metadata (presence only) ────────────
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: word
        name: exposed-git-config
        part: body
        words: ["[core]", "repositoryformatversion"]
        condition: and
      - type: word
        part: header
        negative: true
        words: ["text/html"]

# ── Request 5: TLS certificate & protocol hygiene (single handshake) ─────────
ssl:
  - address: "{{Host}}:443"
    matchers-condition: or
    matchers:
      - type: dsl
        name: ssl-certificate-expired
        dsl:
          - "not_after < unixtime()"
      - type: dsl
        name: ssl-certificate-expiring-30d
        dsl:
          - "not_after >= unixtime() && not_after < (unixtime() + 2592000)"
      - type: dsl
        name: ssl-certificate-expiring-90d
        dsl:
          - "not_after >= (unixtime() + 2592000) && not_after < (unixtime() + 7776000)"
      - type: dsl
        name: ssl-self-signed
        dsl:
          - "self_signed == true"
      - type: dsl
        name: ssl-weak-protocol
        dsl:
          - "tls_version == 'tls10' || tls_version == 'tls11'"