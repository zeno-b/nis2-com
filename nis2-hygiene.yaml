id: nis2-web-hygiene

# ─────────────────────────────────────────────────────────────────────────────
# NIS2 web-security hygiene — DETECTION ONLY, HTTP-only, 5 requests per host.
#
# Single-protocol (http) template so it loads on every nuclei version. TLS
# checks live in the companion file nis2-tls.yaml (run separately).
#
# Observes only: headers, cookie flags, CORS, information disclosure, tech
# fingerprints, exposed well-known files, error-page behaviour. No exploit
# input, no payloads, no traversal-to-read. Confirms a misconfiguration exists
# and goes no further.
#
# IF YOU STILL SEE ZERO FINDINGS, in this order:
#   1. nuclei -t nis2-hygiene.yaml -validate      → template loads cleanly?
#   2. nuclei -t nis2-hygiene.yaml -u https://<a-site-you-own> -debug
#      (debug prints each matcher evaluating against the real response)
#   3. If running via the scanner: do NOT pass a severity filter. This template
#      is severity:info; a filter like -severity high,critical excludes it and
#      you get zero. Run it unfiltered or on its own.
# ─────────────────────────────────────────────────────────────────────────────

info:
  name: NIS2 Web Security Hygiene (detection-only, http)
  author: nis2-scanner
  severity: info
  description: >
    Non-intrusive detection of common web-security misconfigurations relevant to
    NIS2 posture. Observation only; no exploitation.
  tags: nis2,misconfig,headers,exposure,detection

http:
  # ── Request 1: root document ───────────────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Origin: "https://nis2-cors-probe.invalid"
    redirects: true
    max-redirects: 2
    matchers-condition: or
    matchers:
      # — Missing security headers (negative word matchers: fire when absent) —
      - type: word
        name: missing-hsts
        part: header
        case-insensitive: true
        negative: true
        words: ["strict-transport-security"]
      - type: word
        name: missing-csp
        part: header
        case-insensitive: true
        negative: true
        words: ["content-security-policy"]
      - type: word
        name: missing-x-frame-options
        part: header
        case-insensitive: true
        negative: true
        condition: and
        words: ["x-frame-options", "frame-ancestors"]
      - type: word
        name: missing-x-content-type-options
        part: header
        case-insensitive: true
        negative: true
        words: ["x-content-type-options"]
      - type: word
        name: missing-referrer-policy
        part: header
        case-insensitive: true
        negative: true
        words: ["referrer-policy"]
      - type: word
        name: missing-permissions-policy
        part: header
        case-insensitive: true
        negative: true
        words: ["permissions-policy"]
      - type: word
        name: missing-coop
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-opener-policy"]
      - type: word
        name: missing-corp
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-resource-policy"]
      - type: word
        name: missing-coep
        part: header
        case-insensitive: true
        negative: true
        words: ["cross-origin-embedder-policy"]

      # — Weak header values (present) —
      - type: word
        name: weak-csp-unsafe-inline
        part: header
        words: ["unsafe-inline"]
      - type: word
        name: weak-csp-unsafe-eval
        part: header
        words: ["unsafe-eval"]
      - type: regex
        name: weak-hsts-max-age
        part: header
        regex:
          - "(?i)strict-transport-security:[^\\r\\n]*max-age=[0-9]{1,7}([^0-9]|$)"

      # — Insecure cookies (compound → DSL) —
      - type: dsl
        name: cookie-missing-secure
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'secure')"
      - type: dsl
        name: cookie-missing-httponly
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'httponly')"
      - type: dsl
        name: cookie-missing-samesite
        dsl:
          - "contains(tolower(all_headers), 'set-cookie') && !contains(tolower(all_headers), 'samesite')"

      # — CORS —
      - type: word
        name: cors-wildcard-origin
        part: header
        case-insensitive: true
        words: ["access-control-allow-origin: *"]
      - type: word
        name: cors-reflects-origin
        part: header
        case-insensitive: true
        words: ["access-control-allow-origin: https://nis2-cors-probe.invalid"]

      # — Information / version disclosure —
      - type: regex
        name: server-version-disclosure
        part: header
        regex:
          - "(?i)server:\\s*\\S+/[0-9]+\\.[0-9]"
      - type: word
        name: x-powered-by-disclosure
        part: header
        case-insensitive: true
        words: ["x-powered-by"]
      - type: word
        name: aspnet-version-disclosure
        part: header
        case-insensitive: true
        condition: or
        words: ["x-aspnet-version", "x-aspnetmvc-version"]
      - type: word
        name: basic-auth-over-cleartext
        part: header
        case-insensitive: true
        words: ["www-authenticate: basic"]
      - type: regex
        name: internal-ip-in-headers
        part: header
        regex:
          - "(?i)(10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})"

      # — Technology fingerprint —
      - type: regex
        name: generator-meta-disclosure
        part: body
        regex:
          - "(?i)<meta[^>]+name=[\"']generator[\"'][^>]+content="
      - type: word
        name: tech-wordpress
        part: body
        condition: or
        words: ["/wp-content/", "/wp-includes/"]
      - type: word
        name: tech-drupal
        part: body
        condition: or
        words: ["Drupal.settings", "/sites/default/files"]
      - type: word
        name: tech-joomla
        part: body
        condition: or
        words: ["/media/jui/", "com_content", "Joomla!"]
      - type: word
        name: tech-magento
        part: body
        condition: or
        words: ["Mage.Cookies", "/static/version", "mage/cookies"]
      - type: word
        name: tech-typo3
        part: body
        condition: or
        words: ["typo3temp", "typo3conf"]

      # — Content integrity / disclosure —
      - type: regex
        name: mixed-content-http-resource
        part: body
        regex:
          - "(?i)(src|href)=[\"']http://"
      - type: regex
        name: stack-trace-disclosure
        part: body
        regex:
          - "(?i)(stack trace:|traceback \\(most recent call last\\)|at [a-z0-9_.]+\\([A-Za-z0-9_]+\\.(java|cs|php|py):[0-9]+\\))"
      - type: word
        name: debug-mode-indicators
        part: body
        condition: or
        words:
          - "Whoops, looks like something went wrong"
          - "Werkzeug Debugger"
          - "DEBUG = True"
      - type: word
        name: directory-listing
        part: body
        condition: and
        words: ["Index of /", "Parent Directory"]
      - type: word
        name: default-webserver-page
        part: body
        condition: or
        words:
          - "Welcome to nginx!"
          - "Apache2 Ubuntu Default Page"
          - "IIS Windows Server"
      - type: word
        name: phpinfo-disclosure
        part: body
        condition: and
        words: ["phpinfo()", "PHP Version"]
      - type: regex
        name: private-key-disclosure
        part: body
        regex:
          - "-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----"
      - type: regex
        name: aws-access-key-disclosure
        part: body
        regex:
          - "AKIA[0-9A-Z]{16}"
      - type: regex
        name: html-comment-secret-hint
        part: body
        regex:
          - "(?i)<!--[^>]*(password|passwd|api[_-]?key|secret|hardcoded)"

  # ── Request 2: RFC 9116 security.txt ───────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/security.txt"
    matchers-condition: or
    matchers:
      - type: dsl
        name: security-txt-present
        dsl:
          - "status_code == 200 && contains(tolower(body), 'contact:')"
      - type: dsl
        name: missing-security-txt
        dsl:
          - "status_code != 200"

  # ── Request 3: robots.txt ──────────────────────────────────────────────────
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words: ["text/plain"]
      - type: regex
        name: sensitive-paths-disclosed
        part: body
        regex:
          - "(?i)disallow:\\s*/(admin|backup|backups|config|api|private|internal|\\.git|db|sql|old|tmp|test|staging|wp-admin|phpmyadmin)"

  # ── Request 4: exposed version-control metadata (presence only) ────────────
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: word
        name: exposed-git-config
        part: body
        condition: and
        words: ["[core]", "repositoryformatversion"]
      - type: word
        part: header
        negative: true
        words: ["text/html"]

  # ── Request 5: error-page behaviour on a random path (verbose errors) ──────
  - method: GET
    path:
      - "{{BaseURL}}/{{rand_text_alpha(12)}}"
    matchers-condition: or
    matchers:
      - type: regex
        name: verbose-error-disclosure
        part: body
        regex:
          - "(?i)(stack trace:|traceback \\(most recent call last\\)|SQLSTATE\\[|Fatal error:|Warning: |ORA-[0-9]{5}|Microsoft OLE DB Provider)"
      - type: word
        name: framework-error-page
        part: body
        condition: or
        words:
          - "Whoops, looks like something went wrong"
          - "Werkzeug Debugger"
          - "Server Error in '/' Application"
